<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RosterMonitor</title>
<meta name="description" content="RosterMonitor — independent roster and duty-limit monitoring for airline crew. Legal documents.">
<style>
  :root {
    --bg: #ffffff; --text: #1d1d1f; --muted: #6e6e73; --accent: #0866c6;
    --rule: #e5e5ea; --box: #f5f5f7; --box-border: #d8d8de;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --text: #f5f5f7; --muted: #98989d; --accent: #4da3ff;
      --rule: #2c2c2e; --box: #141416; --box-border: #2c2c2e;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text); min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font: 400 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 26rem; padding: 2rem 1.5rem; text-align: center; }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 0.5rem; }
  .tagline { color: var(--muted); margin-bottom: 2.2rem; }
  .links { display: flex; flex-direction: column; gap: 0.7rem; }
  .links a {
    display: block; padding: 0.9rem 1.2rem; border: 1px solid var(--box-border);
    border-radius: 12px; background: var(--box); color: var(--text);
    text-decoration: none; font-weight: 600; font-size: 16px;
  }
  .links a span { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }
  footer { margin-top: 2.5rem; color: var(--muted); font-size: 13px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>RosterMonitor</h1>
  <p class="tagline">Independent roster &amp; duty-limit monitoring for airline crew.<br>Nezávislé sledování plánku a limitů pro posádky.</p>
  <nav class="links">
    <a href="/privacy/">Privacy Policy<span>Zásady ochrany soukromí</span></a>
    <a href="/terms/">Terms of Service<span>Podmínky užívání</span></a>
  </nav>
  <footer>
    <p>prodavam-nemovitost.cz · <a href="mailto:info@prodavam-nemovitost.cz">info@prodavam-nemovitost.cz</a></p>
  </footer>
</main>
</body>
</html>
